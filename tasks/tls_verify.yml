---
# Verify that the PGBouncer service user can read the TLS files. A file that
# PGBouncer cannot open fails the play here, before the configuration file is
# written, instead of failing the service at its next restart.
#
# The check runs as pgbouncer_user, the identity the systemd unit runs
# PGBouncer as. runuser applies the user's supplementary groups, as systemd
# does, so the check also proves the membership in pgbouncer_group. `test -r`
# covers traversal of every directory and read permission on the file itself,
# for files the role uploaded and files that arrived by other means.

- name: Start with an empty list of TLS files
  set_fact:
    _pgbouncer_tls_paths: []

- name: Add the client TLS files
  set_fact:
    _pgbouncer_tls_paths: "{{ _pgbouncer_tls_paths + [pgbouncer_client_tls_ca_file, pgbouncer_client_tls_cert_file, pgbouncer_client_tls_key_file] }}"
  when: pgbouncer_client_tls | bool

- name: Add the server TLS files
  set_fact:
    _pgbouncer_tls_paths: "{{ _pgbouncer_tls_paths + [pgbouncer_server_tls_ca_file, pgbouncer_server_tls_cert_file, pgbouncer_server_tls_key_file] }}"
  when: pgbouncer_server_tls | bool

# `select` drops an empty path, for example the client CA file when client
# certificates aren't validated. `unique` handles a CA file shared by both sides.
- name: Verify the PGBouncer user can read the TLS files
  command: runuser -u {{ pgbouncer_user | quote }} -- test -r {{ item | quote }}
  loop: "{{ _pgbouncer_tls_paths | select | unique }}"
  loop_control:
    label: "{{ pgbouncer_user }} can read {{ item }}"
  changed_when: false
