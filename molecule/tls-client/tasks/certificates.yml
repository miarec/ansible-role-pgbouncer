---
# Generate a test PKI on the control machine. These tasks run in the
# `hosts: localhost` play of prepare.yml and write to `tls_src_dir` only.
# Nothing here touches the target.
#
# Layout of tls_src_dir/:
#   ca.key, ca.crt                     The test CA. The key never leaves the
#                                      control machine.
#   pgbouncer/server.key, server.crt   The certificate PGBouncer presents to
#                                      its clients. The role uploads these,
#                                      with ca.crt, during converge.
#
# Every command has `creates:`, so a second `molecule prepare` reuses the CA
# and the server certificate keeps chaining to it.

- name: Create certificate directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ tls_src_dir }}"
    - "{{ tls_src_dir }}/pgbouncer"

# ============ CA ============
- name: Generate CA private key
  command: openssl genrsa -out {{ tls_src_dir }}/ca.key 4096
  args:
    creates: "{{ tls_src_dir }}/ca.key"

- name: Generate CA certificate
  command: >
    openssl req -x509 -new -nodes
    -key {{ tls_src_dir }}/ca.key
    -sha256 -days 365
    -out {{ tls_src_dir }}/ca.crt
    -subj "/CN=PGBouncer-Test-CA"
  args:
    creates: "{{ tls_src_dir }}/ca.crt"

# ============ PGBouncer server certificate ============
# PGBouncer runs on the target and listens on the loopback interface, so the
# certificate is issued for localhost.
- name: Generate PGBouncer server private key
  command: openssl genrsa -out {{ tls_src_dir }}/pgbouncer/server.key 2048
  args:
    creates: "{{ tls_src_dir }}/pgbouncer/server.key"

- name: Create PGBouncer server certificate config
  copy:
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = localhost

      [v3_req]
      keyUsage = digitalSignature, keyEncipherment
      extendedKeyUsage = serverAuth
      subjectAltName = @alt_names

      [alt_names]
      DNS.1 = localhost
      IP.1 = 127.0.0.1
    dest: "{{ tls_src_dir }}/pgbouncer/server.cnf"
    mode: "0644"

- name: Generate PGBouncer server CSR
  command: >
    openssl req -new
    -key {{ tls_src_dir }}/pgbouncer/server.key
    -out {{ tls_src_dir }}/pgbouncer/server.csr
    -config {{ tls_src_dir }}/pgbouncer/server.cnf
  args:
    creates: "{{ tls_src_dir }}/pgbouncer/server.csr"

- name: Sign PGBouncer server certificate with CA
  command: >
    openssl x509 -req
    -in {{ tls_src_dir }}/pgbouncer/server.csr
    -CA {{ tls_src_dir }}/ca.crt
    -CAkey {{ tls_src_dir }}/ca.key
    -CAcreateserial
    -out {{ tls_src_dir }}/pgbouncer/server.crt
    -days 365 -sha256
    -extensions v3_req
    -extfile {{ tls_src_dir }}/pgbouncer/server.cnf
  args:
    creates: "{{ tls_src_dir }}/pgbouncer/server.crt"
