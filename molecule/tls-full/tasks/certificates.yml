---
# Generate a test PKI for each service on the control machine. These tasks run
# in the `hosts: localhost` play of prepare.yml and write to `tls_src_dir`
# only. Nothing here touches the target.
#
# PGBouncer and PostgreSQL each get their own CA, so the role uploads two
# distinct CA files and the test proves that PGBouncer validates PostgreSQL
# against the one at pgbouncer_server_tls_ca_file. Layout of
# tls_src_dir/<service>/:
#   ca.key, ca.crt           The service's CA. The key never leaves the
#                            control machine.
#   server.key, server.crt   The certificate the service presents. The role
#                            uploads PGBouncer's, with both CA certificates,
#                            during converge. prepare.yml uploads PostgreSQL's.
#
# Every command has `creates:`, so a second `molecule prepare` reuses the CAs
# and the server certificates keep chaining to them.

- name: Create certificate directories
  file:
    path: "{{ tls_src_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [pgbouncer, postgresql]

# ============ CA ============
- name: Generate CA private key
  command: openssl genrsa -out {{ tls_src_dir }}/{{ item }}/ca.key 4096
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/ca.key"
  loop: [pgbouncer, postgresql]

- name: Generate CA certificate
  command: >
    openssl req -x509 -new -nodes
    -key {{ tls_src_dir }}/{{ item }}/ca.key
    -sha256 -days 365
    -out {{ tls_src_dir }}/{{ item }}/ca.crt
    -subj "/CN=Test-CA-{{ item }}"
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/ca.crt"
  loop: [pgbouncer, postgresql]

# ============ Server certificates ============
# PGBouncer and PostgreSQL run on the target and listen on the loopback
# interface, so both certificates are issued for localhost. The IP SAN lets
# verify-full pass for a connection to 127.0.0.1.
- name: Generate server private key
  command: openssl genrsa -out {{ tls_src_dir }}/{{ item }}/server.key 2048
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.key"
  loop: [pgbouncer, postgresql]

- name: Create server certificate config
  copy:
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = localhost

      [v3_req]
      keyUsage = digitalSignature, keyEncipherment
      extendedKeyUsage = serverAuth
      subjectAltName = @alt_names

      [alt_names]
      DNS.1 = localhost
      IP.1 = 127.0.0.1
    dest: "{{ tls_src_dir }}/{{ item }}/server.cnf"
    mode: "0644"
  loop: [pgbouncer, postgresql]

- name: Generate server CSR
  command: >
    openssl req -new
    -key {{ tls_src_dir }}/{{ item }}/server.key
    -out {{ tls_src_dir }}/{{ item }}/server.csr
    -config {{ tls_src_dir }}/{{ item }}/server.cnf
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.csr"
  loop: [pgbouncer, postgresql]

- name: Sign server certificate with the service's CA
  command: >
    openssl x509 -req
    -in {{ tls_src_dir }}/{{ item }}/server.csr
    -CA {{ tls_src_dir }}/{{ item }}/ca.crt
    -CAkey {{ tls_src_dir }}/{{ item }}/ca.key
    -CAcreateserial
    -out {{ tls_src_dir }}/{{ item }}/server.crt
    -days 365 -sha256
    -extensions v3_req
    -extfile {{ tls_src_dir }}/{{ item }}/server.cnf
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.crt"
  loop: [pgbouncer, postgresql]
