---
# Generate a test PKI on the control machine. These tasks run in the
# `hosts: localhost` play of prepare.yml and write to `tls_src_dir` only.
# Nothing here touches the target.
#
# PGBouncer and PostgreSQL share one CA, like a deployment with an internal
# CA. Layout of tls_src_dir/:
#   ca.key, ca.crt                      The test CA. The key never leaves the
#                                       control machine.
#   pgbouncer/server.key, server.crt    The certificate PGBouncer presents to
#                                       its clients. The role uploads these,
#                                       with ca.crt, during converge.
#   postgresql/server.key, server.crt   The certificate PostgreSQL presents to
#                                       PGBouncer. prepare.yml uploads these.
#
# Every command has `creates:`, so a second `molecule prepare` reuses the CA
# and the server certificates keep chaining to it.

- name: Create certificate directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ tls_src_dir }}"
    - "{{ tls_src_dir }}/pgbouncer"
    - "{{ tls_src_dir }}/postgresql"

# ============ CA ============
- name: Generate CA private key
  command: openssl genrsa -out {{ tls_src_dir }}/ca.key 4096
  args:
    creates: "{{ tls_src_dir }}/ca.key"

- name: Generate CA certificate
  command: >
    openssl req -x509 -new -nodes
    -key {{ tls_src_dir }}/ca.key
    -sha256 -days 365
    -out {{ tls_src_dir }}/ca.crt
    -subj "/CN=Test-CA"
  args:
    creates: "{{ tls_src_dir }}/ca.crt"

# ============ Server certificates ============
# PGBouncer and PostgreSQL run on the target and listen on the loopback
# interface, so both certificates are issued for localhost.
- name: Generate server private key
  command: openssl genrsa -out {{ tls_src_dir }}/{{ item }}/server.key 2048
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.key"
  loop: [pgbouncer, postgresql]

- name: Create server certificate config
  copy:
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = localhost

      [v3_req]
      keyUsage = digitalSignature, keyEncipherment
      extendedKeyUsage = serverAuth
      subjectAltName = @alt_names

      [alt_names]
      DNS.1 = localhost
      IP.1 = 127.0.0.1
    dest: "{{ tls_src_dir }}/{{ item }}/server.cnf"
    mode: "0644"
  loop: [pgbouncer, postgresql]

- name: Generate server CSR
  command: >
    openssl req -new
    -key {{ tls_src_dir }}/{{ item }}/server.key
    -out {{ tls_src_dir }}/{{ item }}/server.csr
    -config {{ tls_src_dir }}/{{ item }}/server.cnf
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.csr"
  loop: [pgbouncer, postgresql]

- name: Sign server certificate with CA
  command: >
    openssl x509 -req
    -in {{ tls_src_dir }}/{{ item }}/server.csr
    -CA {{ tls_src_dir }}/ca.crt
    -CAkey {{ tls_src_dir }}/ca.key
    -CAcreateserial
    -out {{ tls_src_dir }}/{{ item }}/server.crt
    -days 365 -sha256
    -extensions v3_req
    -extfile {{ tls_src_dir }}/{{ item }}/server.cnf
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.crt"
  loop: [pgbouncer, postgresql]
