---
# The TLS fixtures are split between the control machine and the target.
#
# Control machine (first play):
#   Generates a test CA and a server certificate for each of PGBouncer and
#   PostgreSQL in `tls_src_dir`, defined once in molecule.yml. The CA private
#   keys stay here.
#
# Target (second play):
#   Installs PostgreSQL and uploads its server certificate and the CA
#   certificate into /etc/postgresql/tls, then enables TLS and creates a test
#   database and user.
#
# Nothing in prepare writes to /etc/pgbouncer/tls. The role creates that
# directory and uploads the PGBouncer server certificate, its key, and both
# CA certificates from `tls_src_dir` during converge, the same way the
# production playbooks do. A passing test therefore proves the role's upload,
# not the fixture's.

- name: Generate TLS certificates on the control machine
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Include TLS certificate generation tasks
      include_tasks: tasks/certificates.yml

- name: Prepare PostgreSQL with TLS for PGBouncer testing
  hosts: all
  become: true

  vars:
    test_db_user: testuser
    test_db_password: testpassword
    test_db_name: testdb
    postgresql_tls_dir: /etc/postgresql/tls

  tasks:
    # Debian/Ubuntu installation
    - name: Install PostgreSQL (Debian/Ubuntu)
      when: ansible_facts['os_family'] == "Debian"
      block:
        - name: Update apt cache
          apt:
            update_cache: true
            cache_valid_time: 600
          changed_when: false

        - name: Install PostgreSQL packages
          apt:
            name:
              - postgresql
              - postgresql-contrib
              - postgresql-client
              - python3-psycopg2
            state: present

    # RedHat/Rocky installation
    - name: Install PostgreSQL (RedHat/Rocky)
      when: ansible_facts['os_family'] == "RedHat"
      block:
        - name: Install PostgreSQL packages
          yum:
            name:
              - postgresql-server
              - postgresql-contrib
              - python3-psycopg2
            state: present

        - name: Check if PostgreSQL is initialized
          stat:
            path: /var/lib/pgsql/data/pg_hba.conf
          register: pg_hba_conf

        - name: Initialize PostgreSQL database
          command: postgresql-setup --initdb
          changed_when: true
          when: not pg_hba_conf.stat.exists

    # Configure PostgreSQL paths
    - name: Find PostgreSQL config directory (Debian)
      when: ansible_facts['os_family'] == "Debian"
      block:
        - name: Get PostgreSQL version directory
          shell: set -o pipefail && ls -1 /etc/postgresql/ | head -1
          args:
            executable: /bin/bash
          register: pg_version
          changed_when: false

        - name: Set PostgreSQL paths for Debian
          set_fact:
            pg_hba_file: "/etc/postgresql/{{ pg_version.stdout }}/main/pg_hba.conf"
            pg_conf_file: "/etc/postgresql/{{ pg_version.stdout }}/main/postgresql.conf"

    - name: Set PostgreSQL paths for RedHat
      when: ansible_facts['os_family'] == "RedHat"
      set_fact:
        pg_hba_file: "/var/lib/pgsql/data/pg_hba.conf"
        pg_conf_file: "/var/lib/pgsql/data/postgresql.conf"

    # Upload the PostgreSQL server certificate. The certificates are generated
    # on the control machine (see tasks/certificates.yml). The package install
    # above creates the postgres user, which owns the files. PostgreSQL
    # requires its private key to be owned by its user and not group or world
    # readable.
    - name: Create PostgreSQL TLS directory
      file:
        path: "{{ postgresql_tls_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"

    - name: Upload PostgreSQL server certificate and CA certificate
      copy:
        src: "{{ tls_src_dir }}/{{ item.src }}"
        dest: "{{ postgresql_tls_dir }}/{{ item.src | basename }}"
        owner: postgres
        group: postgres
        mode: "{{ item.mode }}"
      loop:
        - { src: postgresql/server.key, mode: "0600" }
        - { src: postgresql/server.crt, mode: "0644" }
        - { src: postgresql/ca.crt, mode: "0644" }
      notify: Restart PostgreSQL

    # Configure PostgreSQL with TLS
    - name: Enable SSL in PostgreSQL
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: "^#?ssl\\s*="
        line: "ssl = on"
        state: present
      notify: Restart PostgreSQL

    - name: Configure SSL certificate file
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: "^#?ssl_cert_file\\s*="
        line: "ssl_cert_file = '{{ postgresql_tls_dir }}/server.crt'"
        state: present
      notify: Restart PostgreSQL

    - name: Configure SSL key file
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: "^#?ssl_key_file\\s*="
        line: "ssl_key_file = '{{ postgresql_tls_dir }}/server.key'"
        state: present
      notify: Restart PostgreSQL

    - name: Configure SSL CA file
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: "^#?ssl_ca_file\\s*="
        line: "ssl_ca_file = '{{ postgresql_tls_dir }}/ca.crt'"
        state: present
      notify: Restart PostgreSQL

    # Start PostgreSQL service
    - name: Start and enable PostgreSQL service
      service:
        name: postgresql
        state: started
        enabled: true

    - name: Flush handlers to restart PostgreSQL with TLS
      meta: flush_handlers

    # Set password_encryption to md5 BEFORE creating users
    - name: Set password_encryption to md5 for PGBouncer compatibility
      become: true
      become_user: postgres
      community.postgresql.postgresql_set:
        name: password_encryption
        value: md5
      notify: Reload PostgreSQL

    - name: Flush handlers to apply password_encryption setting
      meta: flush_handlers

    - name: Create test database
      become: true
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ test_db_name }}"
        state: present

    # Create user with explicit md5-compatible password
    - name: Create test user with password
      become: true
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ test_db_user }}"
        password: "{{ test_db_password }}"
        state: present

    - name: Grant privileges to test user
      become: true
      become_user: postgres
      community.postgresql.postgresql_privs:
        database: "{{ test_db_name }}"
        privs: ALL
        type: database
        role: "{{ test_db_user }}"

    # Configure pg_hba for TLS connections (hostssl) with md5
    - name: Configure pg_hba.conf for TLS md5 authentication from localhost
      community.postgresql.postgresql_pg_hba:
        dest: "{{ pg_hba_file }}"
        contype: hostssl
        databases: all
        users: all
        source: 127.0.0.1/32
        method: md5
        state: present
      notify: Reload PostgreSQL

    # Also add host entry for non-TLS testing (direct PostgreSQL connection test)
    - name: Configure pg_hba.conf for non-TLS md5 authentication from localhost
      community.postgresql.postgresql_pg_hba:
        dest: "{{ pg_hba_file }}"
        contype: host
        databases: all
        users: all
        source: 127.0.0.1/32
        method: md5
        state: present
      notify: Reload PostgreSQL

    - name: Flush handlers to reload PostgreSQL immediately
      meta: flush_handlers

  handlers:
    - name: Reload PostgreSQL
      service:
        name: postgresql
        state: reloaded

    - name: Restart PostgreSQL
      service:
        name: postgresql
        state: restarted
